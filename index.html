<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Anime Log - IT KMITL Portfolio</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: #2b2b3d;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        h1 {
            text-align: center;
            color: #74c7ec;
        }
        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #45475a;
            background-color: #11111b;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            background-color: #89b4fa;
            border: none;
            border-radius: 6px;
            color: #11111b;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #b4befe;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background-color: #181825;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background-color: #f38ba8;
            padding: 4px 8px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 My Anime Log</h1>
        
        <div class="form-group">
            <input type="text" id="animeInput" placeholder="พิมพ์ชื่ออนิเมะที่ชอบ...">
            <button id="addBtn">บันทึก</button>
        </div>

        <h3>รายการที่บันทึกไว้ในฐานข้อมูล:</h3>
        <ul id="animeList">
            <!-- ข้อมูลจากฐานข้อมูลจะมาแสดงผลตรงนี้ -->
        </ul>
    </div>

    <script>
        const animeInput = document.getElementById('animeInput');
        const addBtn = document.getElementById('addBtn');
        const animeList = document.getElementById('animeList');

        // 1. ดึงรายการอนิเมะทั้งหมดจากฐานข้อมูลมาแสดง
        async function fetchAnimes() {
            const res = await fetch('/api/animes');
            const data = await res.json();
            
            animeList.innerHTML = ''; // ล้างหน้าจอเดิมก่อน
            
            data.forEach((anime, index) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${index + 1}. ${anime.title}</span>
                    <button class="delete-btn" onclick="deleteAnime(${anime.id})">ลบ</button>
                `;
                animeList.appendChild(li);
            });
        }

        // 2. ส่งชื่ออนิเมะใหม่ไปบันทึกลงฐานข้อมูล
        addBtn.addEventListener('click', async () => {
            const title = animeInput.value.trim();
            if (!title) {
                alert('กรุณากรอกชื่ออนิเมะก่อนครับ!');
                return;
            }

            await fetch('/api/animes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: title })
            });

            animeInput.value = '';
            fetchAnimes(); // โหลดข้อมูลใหม่มาอัปเดตหน้าจอ
        });

        // 3. สั่งลบอนิเมะออกจากฐานข้อมูล
        async function deleteAnime(id) {
            await fetch(`/api/animes/${id}`, {
                method: 'DELETE'
            });
            fetchAnimes(); // โหลดข้อมูลใหม่มาอัปเดตหน้าจอ
        }

        // เรียกทำงานทันทีที่เปิดหน้าเว็บ
        fetchAnimes();
    </script>
</body>
</html>
